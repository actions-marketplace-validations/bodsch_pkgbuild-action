---

name: Test pkgbuild action

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    runs-on:
      - ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Build Python Plugin
      id: build-plugin
      uses: ./
      with:
        source: src
        package-name: plugin
        version: "${{ github.ref_name }}"

    - name: Check
      shell: bash
      run: echo build_path "${{ steps.build-plugin.outputs.build_path }}"
